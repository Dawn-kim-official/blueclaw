name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blueclaw
          POSTGRES_PASSWORD: blueclaw
          POSTGRES_DB: blueclaw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blueclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          BLUECLAW_TEST_POSTGRES_URL: postgres://blueclaw:blueclaw@127.0.0.1:5432/blueclaw?sslmode=disable

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
