{
  "baseURL": "http://127.0.0.1:8080",
  "capability": {
    "socketPath": "/run/internkim/capability.sock",
    "endpoint": "http://internkim/v1/capabilities"
  },
  "languageModel": {
    "defaultProvider": "capability",
    "fallbackProvider": "liteRTLM",
    "capability": {
      "modelName": "openai/gpt-4.1-mini",
      "requireParameters": true,
      "enableResponseHealing": true
    },
    "openRouter": {
      "baseURL": "https://openrouter.ai/api/v1/chat/completions",
      "modelName": "openai/gpt-4.1-mini",
      "requireParameters": true,
      "enableResponseHealing": true
    },
    "liteRTLM": {
      "wrapperPath": "/usr/local/bin/blueclaw-litert-wrapper",
      "wrapperArguments": [
        "--stdio"
      ],
      "modelPath": "/workspace/.blueclaw/models/gemma-3n-E2B-it-int4.litertlm",
      "backend": "cpu",
      "constraintProvider": "llguidance"
    }
  },
  "firecracker": {
    "firecrackerPath": "/usr/local/bin/firecracker",
    "jailerPath": "/usr/local/bin/jailer",
    "kernelImagePath": "/opt/blueclaw/vmlinux.bin",
    "rootfsImagePath": "/opt/blueclaw/rootfs.ext4",
    "workspaceImagePath": "/var/lib/blueclaw/workspace.ext4",
    "vcpuCount": 4,
    "memoryMiB": 8192,
    "vsockCID": 52,
    "healthPortOrService": "8080",
    "logDirectoryPath": "/var/log/blueclaw-supervisor"
  },
  "bridge": {
    "mode": "localAgent",
    "authMode": "sshKeyReuse",
    "authorizedPublicKeysPath": "/var/lib/blueclaw/authorized_companions",
    "listenAddress": "127.0.0.1:7778"
  },
  "connectors": {
    "mattermost": {
      "baseURL": "http://localhost:8065"
    },
    "slack": {
      "baseURL": "https://slack.com/api"
    },
    "signal": {
      "enabled": false
    }
  },
  "logging": {
    "directoryPath": "/workspace/.blueclaw/logs",
    "retentionDays": 7
  },
  "agentProfiles": [
    {
      "name": "planner",
      "allowedToolNames": [
        "mcp.workspace.list"
      ]
    },
    {
      "name": "researcher",
      "allowedToolNames": [
        "mcp.workspace.read"
      ]
    }
  ],
  "mcpServers": [
    {
      "name": "workspace",
      "transport": "stdio",
      "command": "blueclaw-mcp-workspace"
    }
  ],
  "terminal": {
    "mode": "native",
    "workspaceRootPath": "/workspace",
    "allowedExecutableNames": [
      "bash",
      "sh",
      "git",
      "glab",
      "rg",
      "find",
      "ls",
      "cat",
      "sed",
      "awk",
      "grep",
      "mkdir",
      "touch",
      "cp",
      "mv",
      "rm",
      "tar",
      "gzip",
      "bun",
      "go"
    ],
    "deniedExecutableNames": [
      "sudo",
      "su",
      "doas",
      "pkexec",
      "mount",
      "umount",
      "systemctl",
      "service",
      "apt",
      "apt-get",
      "dpkg",
      "yum",
      "dnf",
      "apk",
      "pacman",
      "snap",
      "flatpak",
      "rpm",
      "modprobe",
      "insmod",
      "shutdown",
      "reboot",
      "halt",
      "poweroff",
      "useradd",
      "userdel",
      "usermod",
      "groupadd",
      "groupdel",
      "passwd",
      "chpasswd",
      "visudo",
      "iptables",
      "nft",
      "sysctl"
    ],
    "deniedPathPrefixes": [
      "/etc",
      "/root",
      "/boot",
      "/sys",
      "/proc",
      "/dev",
      "/run",
      "/var/lib",
      "/var/run",
      "/usr",
      "/opt",
      "/srv"
    ],
    "timeoutSecond": 120,
    "allowNetwork": true,
    "allowInteractiveShell": true
  },
  "scheduler": {
    "retentionCheckIntervalMinute": 60,
    "taskSchedulePollIntervalSecond": 30
  }
}
